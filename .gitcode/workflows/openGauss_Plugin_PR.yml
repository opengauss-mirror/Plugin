name: openGauss_Plugin_PR

on:
  pull_request_target:
    types:
      - open
      - update
      - reopen
    branches:
      - master
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/retest\s*$'
  workflow_dispatch:

permissions:
  repository: read
  pr: write
  note: write

concurrency:
  max: 100
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

env:
  GITCODE_REPO: opengauss/Plugin
  PLUGIN_REPO: https://gitcode.com/opengauss/Plugin.git
  SERVER_REPO: https://gitcode.com/opengauss/openGauss-server.git
  PRIVATE_BUILD_SCRIPT: /home/PrivateBuild_tools/Private_Main_Plugin.sh
  GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
  GITCODE_RUN_ID: ${{ atomgit.workflow_run_id }}
  PR_TARGET_BRANCH: ${{ atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch }}
  GITCODE_PR_IID: ${{ atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.issue.number || atomgit.event.note.merge_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number || '' }}

stages:
  create_label:
    name: create_label
    select: selected_by_default
    jobs:
      prepare:
        name: Mark running
        runs-on: [self-hosted, plugin_1]
        timeout-minutes: 10
        continue-on-error: true
        steps:
          - name: notify_ci_started
            id: notify_ci_started
            if: ${{ env.GITCODE_PR_IID != '' }}
            uses: cann/.gitcode/actions/pre-pipeline@master
            with:
              owner: opengauss
              repo: Plugin
              pr_number: ${{ env.GITCODE_PR_IID }}
              token: ${{ secrets.PR_LABEL_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.GITCODE_REPO }}/actions/runs/${{ atomgit.workflow_run_id }}
              actor: ${{ atomgit.actor }}
              pr_author: ${{ atomgit.event.pull_request.user.login }}
          - name: create_label_and_comment_fallback
            id: state
            if: ${{ always() && env.GITCODE_PR_IID != '' && steps.notify_ci_started.outcome != 'success' }}
            env:
              LABEL_JOB_TAG: prepare
              PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
              CI_RUN_URL: https://gitcode.com/${{ env.GITCODE_REPO }}/actions/runs/${{ atomgit.workflow_run_id }}
            run: |
              set -eu
              umask 077
              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "https://gitcode.com/${GITCODE_REPO}.git" "${src}"
              label_script="${src}/.gitcode/scripts/gitcode_pr_labels.sh"
              notify_script="${src}/.gitcode/scripts/gitcode_ci_notify.sh"
              bash "${label_script}" delete ci-pipeline-success || true
              bash "${label_script}" delete ci-pipeline-failed || true
              bash "${label_script}" add ci-pipeline-running
              if [ ! -f "${notify_script}" ]; then
                echo "missing ${notify_script}; ensure gitcode_ci_notify.sh is on master" >&2
                exit 1
              fi
              bash "${notify_script}"

  only_doc:
    name: only_doc
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        continue-on-error: true
        runs-on: [self-hosted, plugin_1]
        outputs:
          need_compile: ${{ steps.set-skip.outputs.need_compile }}
        steps:
          - name: set build skip flag
            id: set-skip
            env:
              PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
            run: |
              set -eu
              umask 077
              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "https://gitcode.com/${GITCODE_REPO}.git" "${src}"
              bash "${src}/.gitcode/scripts/detect_need_compile.sh"

  compile:
    name: openGauss_plugin_compile
    select: selected_by_default
    jobs:
      plugin_compile:
        name: plugin_compile
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_compile == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, plugin_1]
        env:
          GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
          GITCODE_REF: ${{ atomgit.ref }}
          GITCODE_TARGET_BRANCH: ${{ atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch }}
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace1/
        outputs:
          result: ${{ steps.run_plugin_compile.outputs.result }}
        steps:
          - name: run_plugin_compile
            id: run_plugin_compile
            run: |
              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "https://gitcode.com/${GITCODE_REPO}.git" "${src}"
              bash "${src}/.gitcode/scripts/plugin_compile.sh"
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      docker_compile:
        name: docker_compile
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_compile == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, docker_1]
        env:
          GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
          GITCODE_REF: ${{ atomgit.ref }}
          GITCODE_TARGET_BRANCH: ${{ atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch }}
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace/
        outputs:
          result: ${{ steps.run_docker_compile.outputs.result }}
        steps:
          - name: run_docker_compile
            id: run_docker_compile
            run: |
              case "${GITCODE_TARGET_BRANCH}" in
                6.0.0|refs/heads/6.0.0)
                  echo "Skip compile_plugin_2: target branch is ${GITCODE_TARGET_BRANCH}"
                  echo "result=0" >> "$ATOMGIT_OUTPUT"
                  exit 0
                  ;;
              esac
              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "https://gitcode.com/${GITCODE_REPO}.git" "${src}"
              bash "${src}/.gitcode/scripts/plugin_compile.sh"
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

  report_result:
    name: Report pipeline result
    select: selected_by_default
    jobs: 
      report_result:
        name: report_result
        runs-on: [self-hosted, plugin_1]
        timeout-minutes: 10
        continue-on-error: false
        outputs:
          labeled: ${{ steps.publish.outputs.labeled }}
        steps:
          - name: Show upstream status
            run: echo "pipeline.upstream_status=${{ pipeline.upstream_status }}"
          - name: Create label state
            id: state
            env:
              LABEL_JOB_TAG: result
              PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
              NEED_COMPILE: ${{ jobs.Detect_file_changes.outputs.need_compile }}
              PLUGIN_COMPILE: ${{ jobs.plugin_compile.outputs.result }}
              DOCKER_COMPILE: ${{ jobs.docker_compile.outputs.result }}
            run: |
              set -eu
              umask 077
              echo "PLUGIN_COMPILE=${PLUGIN_COMPILE}"
              echo "DOCKER_COMPILE=${DOCKER_COMPILE}"

              pipeline_success=-1
              if [ "$PLUGIN_COMPILE" = 0 ] && [ "$DOCKER_COMPILE" = 0 ]; then
                echo "全部为 0"
                pipeline_success=0
              else
                echo "有非 0"
                pipeline_success=1
              fi

              if [ "${NEED_COMPILE}" = 'no' ]; then
                echo "只有文档修改，跳过用例部分"
                pipeline_success=0
              fi

              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "https://gitcode.com/${GITCODE_REPO}.git" "${src}"
              label_script="${src}/.gitcode/scripts/gitcode_pr_labels.sh"

              if [ "${pipeline_success}" == 0 ]; then
                echo "-------- 打 success 标签 --------"
                bash "${label_script}" delete ci-pipeline-running
                bash "${label_script}" delete ci-pipeline-failed
                bash "${label_script}" add ci-pipeline-success
              else
                echo "-------- 打 failed 标签 ---------"
                bash "${label_script}" delete ci-pipeline-running
                bash "${label_script}" delete ci-pipeline-success
                bash "${label_script}" add ci-pipeline-failed
                exit 1
              fi
