name: openGauss_Plugin_PR

on:
  push:
    branches:
      - master
      - '**'
  pull_request_target:
    branches:
      - master
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/retest\s*$'
  workflow_dispatch:

permissions:
  repository: read
  pr: write
  note: write

# 同一 PR 再次触发（新提交、reopen、/retest）时，立刻取消还在跑的上一次门禁。
# mr_id 抢占只作用于同一个合并请求；不同 PR 仍可并行，最多 5 条。
concurrency:
  enable: true
  max: 100
  exceed-action: QUEUE
  preemption:
    enable: true
    events:
      - mr_id

env:
  GITCODE_REPO: opengauss/Plugin
  PLUGIN_REPO: https://gitcode.com/opengauss/Plugin.git
  SERVER_REPO: https://gitcode.com/opengauss/openGauss-server.git
  PRIVATE_BUILD_SCRIPT: /home/PrivateBuild_tools/Private_Main_Plugin.sh
  PR_TARGET_BRANCH: ${{ atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch }}

jobs:
  prepare:
    name: Mark running
    runs-on: [self-hosted, plugin_1]
    steps:
      - name: Mark PR as running
        if: ${{ atomgit.event.pull_request.number != '' }}
        uses: openlibing/pr-label-action@v1.0.0
        with:
          add_labels: ci-pipeline-running
          remove_labels: ci-pipeline-success,ci-pipeline-failed,ci-pipeline-passed
          token: ${{secrets.PR_LABEL_TOKEN}}

  compile_plugin_1:
    name: openGauss_Plugin_Compile
    needs: prepare
    runs-on: [self-hosted, plugin_1]
    timeout-minutes: 120
    env:
      GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
      GITCODE_REF: ${{ atomgit.ref }}
      GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}
      GITCODE_TARGET_BRANCH: ${{ atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch }}
    steps:
      - name: Run openGauss plugin compile on plugin-1
        run: |
          set -eu
          # CI scripts always come from opengauss/Plugin master, not the PR target branch.
          repo="${GITCODE_REPO:-opengauss/Plugin}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dest="${PWD}/master-gitcode-scripts"
          rm -rf "${dest}"
          mkdir -p "${dest}"
          dir="$(mktemp -d)"
          cleanup() {
            rm -rf "${dir}"
          }
          trap cleanup EXIT
          echo "Fetch CI scripts from ${server}/${repo}.git refs/heads/master"
          (
            cd "${dir}"
            git init -q
            git remote add origin "${server}/${repo}.git"
            timeout 300 git fetch --depth=1 --force origin refs/heads/master
            git show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dest}/resolve_gitcode_env.sh"
            git show "FETCH_HEAD:.gitcode/scripts/plugin_compile.sh" > "${dest}/plugin_compile.sh"
          )
          source "${dest}/resolve_gitcode_env.sh"
          bash "${dest}/plugin_compile.sh"
        env:
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace1/

  compile_plugin_2:
    name: openGauss_Plugin_Compile_Part2
    needs: prepare
    # 目标分支为 6.0.0 的 PR 不调度 docker_1 编译。
    if: ${{ env.PR_TARGET_BRANCH != '6.0.0' && env.PR_TARGET_BRANCH != 'refs/heads/6.0.0' }}
    runs-on: [self-hosted, docker_1]
    timeout-minutes: 120
    env:
      GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
      GITCODE_REF: ${{ atomgit.ref }}
      GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}
      GITCODE_TARGET_BRANCH: ${{ atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch }}
    steps:
      - name: Run openGauss plugin compile on docker-1
        run: |
          set -eu
          # CI scripts always come from opengauss/Plugin master, not the PR target branch.
          repo="${GITCODE_REPO:-opengauss/Plugin}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dest="${PWD}/master-gitcode-scripts"
          rm -rf "${dest}"
          mkdir -p "${dest}"
          dir="$(mktemp -d)"
          cleanup() {
            rm -rf "${dir}"
          }
          trap cleanup EXIT
          echo "Fetch CI scripts from ${server}/${repo}.git refs/heads/master"
          (
            cd "${dir}"
            git init -q
            git remote add origin "${server}/${repo}.git"
            timeout 300 git fetch --depth=1 --force origin refs/heads/master
            git show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dest}/resolve_gitcode_env.sh"
            git show "FETCH_HEAD:.gitcode/scripts/plugin_compile.sh" > "${dest}/plugin_compile.sh"
          )
          source "${dest}/resolve_gitcode_env.sh"
          bash "${dest}/plugin_compile.sh"
        env:
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace/

post:
  jobs:
    report_result:
      name: Report pipeline result
      runs-on: [self-hosted, plugin_1]
      steps:
        - name: Set result label
          uses: openlibing/pr-label-action@v1.0.0
          with:
            add_labels: ${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-success' || 'ci-pipeline-failed' }}
            remove_labels: ci-pipeline-running,${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-failed' || 'ci-pipeline-success' }}
            token: ${{secrets.PR_LABEL_TOKEN}}