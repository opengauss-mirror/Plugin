          fi
          repo_url="${server%/}/${repo}.git"
          ref="${ATOMGIT_REF:-}"
          if [ -z "${ref}" ]; then
            ref="${GITCODE_REF:-}"
          fi
          if [ -z "${ref}" ]; then
            ref="refs/heads/master"
          fi
          sha="${ATOMGIT_SHA:-}"
          if [ -z "${sha}" ]; then
            sha="${GITCODE_SHA:-}"
          fi
          if [ -z "${sha}" ]; then
            sha="FETCH_HEAD"
          fi
          echo "Manual checkout ${repo_url} ${ref} ${sha}"

          mkdir -p "${workspace}"
