name: openGauss_Plugin_PR

on:
  push:
    branches:
      - master
  pull_request_target:
    branches:
      - master
  pull_request_comment:
    types:
      - created
    branches:
      - master
    comments:
      - '/retest'
  workflow_dispatch:

permissions:
  repository: read
  pr: write
  note: write

env:
  GITCODE_REPO: opengauss/Plugin
  PLUGIN_REPO: https://gitcode.com/opengauss/Plugin.git
  SERVER_REPO: https://gitcode.com/opengauss/openGauss-server.git
  PRIVATE_BUILD_SCRIPT: /home/PrivateBuild_tools/Private_Main_Plugin.sh

jobs:
  prepare:
    name: Mark running
    runs-on: [self-hosted, plugin_1]
    steps:
      - name: Manual checkout source code
        run: |
          bash .gitcode/scripts/manual_checkout.sh
      - name: Resolve GitCode event variables
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh

      - name: Mark PR as running
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/gitcode_pr_labels.sh running
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}

  compile_plugin_1:
    name: openGauss_Plugin_Compile
    needs: prepare
    runs-on: [self-hosted, plugin_1]
    timeout-minutes: 120
    steps:
      - name: Manual checkout source code
        run: |
          bash .gitcode/scripts/manual_checkout.sh
      - name: Run openGauss plugin compile on plugin-1
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/plugin_compile.sh
        env:
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace1/

  compile_plugin_2:
    name: openGauss_Plugin_Compile_Part2
    needs: prepare
    runs-on: [self-hosted, docker_1]
    timeout-minutes: 120
    steps:
      - name: Manual checkout source code
        run: |
          bash .gitcode/scripts/manual_checkout.sh
      - name: Run openGauss plugin compile on docker-1
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/plugin_compile.sh
        env:
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace/

  report_success:
    name: Mark success
    needs:
      - compile_plugin_1
      - compile_plugin_2
    runs-on: [self-hosted, plugin_1]
    steps:
      - name: Manual checkout source code
        run: |
          bash .gitcode/scripts/manual_checkout.sh
      - name: Mark PR as success
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/gitcode_pr_labels.sh success
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}

  report_failed:
    name: Mark failed
    if: ${{ failed() }}
    needs:
      - compile_plugin_1
      - compile_plugin_2
    runs-on: [self-hosted, plugin_1]
    steps:
      - name: Manual checkout source code
        run: |
          bash .gitcode/scripts/manual_checkout.sh
      - name: Mark PR as failed
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/gitcode_pr_labels.sh failed
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
