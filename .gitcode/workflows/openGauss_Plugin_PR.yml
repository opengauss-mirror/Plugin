name: openGauss_Plugin_PR

on:
  push:
    branches:
      - master
      - '**'
  pull_request_target:
    branches:
      - master
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/retest\s*$'
  workflow_dispatch:

permissions:
  repository: read
  pr: write
  note: write

env:
  GITCODE_REPO: opengauss/Plugin
  LABEL_SCRIPT_BRANCH: master
  PLUGIN_REPO: https://gitcode.com/opengauss/Plugin.git
  SERVER_REPO: https://gitcode.com/opengauss/openGauss-server.git
  PRIVATE_BUILD_SCRIPT: /home/PrivateBuild_tools/Private_Main_Plugin.sh

jobs:
  prepare:
    name: Mark running
    runs-on: [self-hosted, plugin_1]
    steps:
      - name: Mark PR as running
        if: ${{ atomgit.event.pull_request.number != '' }}
        continue-on-error: true
        run: |
          curl -fsSL "https://gitcode.com/opengauss/Plugin/raw/${LABEL_SCRIPT_BRANCH}/.gitcode/scripts/gitcode_pr_labels.sh" -o /tmp/gitcode_pr_labels.sh
          bash /tmp/gitcode_pr_labels.sh running
        env:
          GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}

  compile_plugin_1:
    name: openGauss_Plugin_Compile
    needs: prepare
    runs-on: [self-hosted, plugin_1]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.compile.outputs.result }}
    steps:
      - name: Manual checkout source code
        id: checkout
        continue-on-error: true
        run: |
          set -e
          workspace="$PWD"
          repo="${ATOMGIT_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITCODE_REPOSITORY:-}"
          fi
          if [ -z "${repo}" ] || ! echo "${repo}" | grep -q '/'; then
            repo="${GITCODE_REPO:-opengauss/Plugin}"
          fi
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          repo_url="${server%/}/${repo}.git"
          ref="${ATOMGIT_REF:-}"
          if [ -z "${ref}" ]; then
            ref="${GITCODE_REF:-}"
          fi
          if [ -z "${ref}" ]; then
            ref="refs/heads/master"
          fi
          sha="${ATOMGIT_SHA:-}"
          if [ -z "${sha}" ]; then
            sha="${GITCODE_SHA:-}"
          fi
          if [ -z "${sha}" ]; then
            sha="FETCH_HEAD"
          fi
          echo "Manual checkout ${repo_url} ${ref} ${sha}"

          mkdir -p "${workspace}"
          cd "${workspace}"
          if [ ! -d .git ]; then
            git init
          fi
          if git remote | grep -qx origin; then
            git remote set-url origin "${repo_url}"
          else
            git remote add origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${ref}"
          git checkout -f "${sha}" || git checkout -f FETCH_HEAD
      - name: Run openGauss plugin compile on plugin-1
        id: compile
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/plugin_compile.sh
          set +e
          if [ "${CHECKOUT_OUTCOME}" != "success" ]; then
            echo "Manual checkout failed; skip compile."
            rc=1
          else
            source .gitcode/scripts/resolve_gitcode_env.sh && bash .gitcode/scripts/plugin_compile.sh
            rc=$?
          fi
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "result=success" >> "${ATOMGIT_OUTPUT}"
          else
            echo "result=failure" >> "${ATOMGIT_OUTPUT}"
          fi
          exit 0
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace1/
          GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}

  compile_plugin_2:
    name: openGauss_Plugin_Compile_Part2
    needs: prepare
    runs-on: [self-hosted, docker_1]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.compile.outputs.result }}
    steps:
      - name: Manual checkout source code
        id: checkout
        continue-on-error: true
        run: |
          set -e
          workspace="$PWD"
          repo="${ATOMGIT_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITCODE_REPOSITORY:-}"
          fi
          if [ -z "${repo}" ] || ! echo "${repo}" | grep -q '/'; then
            repo="${GITCODE_REPO:-opengauss/Plugin}"
          fi
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          repo_url="${server%/}/${repo}.git"
          ref="${ATOMGIT_REF:-}"
          if [ -z "${ref}" ]; then
            ref="${GITCODE_REF:-}"
          fi
          if [ -z "${ref}" ]; then
            ref="refs/heads/master"
          fi
          sha="${ATOMGIT_SHA:-}"
          if [ -z "${sha}" ]; then
            sha="${GITCODE_SHA:-}"
          fi
          if [ -z "${sha}" ]; then
            sha="FETCH_HEAD"
          fi
          echo "Manual checkout ${repo_url} ${ref} ${sha}"

          mkdir -p "${workspace}"
          cd "${workspace}"
          if [ ! -d .git ]; then
            git init
          fi
          if git remote | grep -qx origin; then
            git remote set-url origin "${repo_url}"
          else
            git remote add origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${ref}"
          git checkout -f "${sha}" || git checkout -f FETCH_HEAD
      - name: Run openGauss plugin compile on docker-1
        id: compile
        run: |
          source .gitcode/scripts/resolve_gitcode_env.sh
          bash .gitcode/scripts/plugin_compile.sh
          set +e
          if [ "${CHECKOUT_OUTCOME}" != "success" ]; then
            echo "Manual checkout failed; skip compile."
            rc=1
          else
            source .gitcode/scripts/resolve_gitcode_env.sh && bash .gitcode/scripts/plugin_compile.sh
            rc=$?
          fi
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "result=success" >> "${ATOMGIT_OUTPUT}"
          else
            echo "result=failure" >> "${ATOMGIT_OUTPUT}"
          fi
          exit 0
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace/
          GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}

post:
  jobs:
    report_result:
      name: Report pipeline result
      runs-on: [self-hosted, plugin_1]
      steps:
        - name: Download PR label script
          run: curl -fsSL "https://gitcode.com/opengauss/Plugin/raw/${LABEL_SCRIPT_BRANCH}/.gitcode/scripts/gitcode_pr_labels.sh" -o /tmp/gitcode_pr_labels.sh
        - name: Mark PR as successful
          if: ${{ success }}
          run: bash /tmp/gitcode_pr_labels.sh success
          env:
            GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}
            PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
        - name: Mark PR as failed
          if: ${{ failed }}
          run: bash /tmp/gitcode_pr_labels.sh failed
          env:
            GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}
            PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
  report_result:
    name: Report pipeline result
    needs:
      - compile_plugin_1
      - compile_plugin_2
    runs-on: [self-hosted, plugin_1]
    steps:
      - name: Report PR label
        run: |
          result="success"
          if [ "${COMPILE_PLUGIN_1_RESULT}" != "success" ] || [ "${COMPILE_PLUGIN_2_RESULT}" != "success" ]; then
            result="failed"
          fi

          echo "compile_plugin_1=${COMPILE_PLUGIN_1_RESULT:-missing}"
          echo "compile_plugin_2=${COMPILE_PLUGIN_2_RESULT:-missing}"
          echo "pipeline_result=${result}"

          curl -fsSL "https://gitcode.com/opengauss/Plugin/raw/${LABEL_SCRIPT_BRANCH}/.gitcode/scripts/gitcode_pr_labels.sh" -o /tmp/gitcode_pr_labels.sh
          bash /tmp/gitcode_pr_labels.sh "${result}"

          if [ "${result}" = "failed" ]; then
            exit 1
          fi
        env:
          COMPILE_PLUGIN_1_RESULT: ${{ needs.compile_plugin_1.outputs.result }}
          COMPILE_PLUGIN_2_RESULT: ${{ needs.compile_plugin_2.outputs.result }}
          GITCODE_PR_IID: ${{ atomgit.event.pull_request.number }}
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}