# pre-commit Configuration (openGauss Plugin, C++ Core)
#
# Strategy: Adopt .clang-format and .clang-tidy, with line width aligned to team standards.
# First-time setup: Run bash setup-pre-commit.sh

# Exclude third-party libraries, build directories, documentation, and non-source files
exclude: '^(doc/|docs/|docs-lite/|build/|contrib/|docker/|third_party/|src/test/|.*\.min\.js$|.*\.o$|.*\.so$)'

repos:
  # 1. Basic hygiene checks
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # temporary disabled cause history reason
      # it will make a lot of modification of removing all trailing whitespace, which make code hard to review
      # - id: trailing-whitespace 
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # # 2. Spell-checking
  # - repo: https://gitcode.com/gh_mirrors/co/codespell
  #   rev: v2.4.1
  #   hooks:
  #     - id: codespell
  #       args: ["--skip=*.o,*.so,*.a,*.exe,*.dll"]
